<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEGASUS OS - Tactical Terminal</title>
    
    <!-- Importando o Visual -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="custom-alert"></div>

    <div id="setup-screen" class="page">
        <div class="panel" style="margin-top: 20vh;">
            <h2 class="panel-title" style="text-align: center;">SYSTEM INITIALISATION</h2>
            <input type="text" id="input-nick" placeholder="Enter Nickname" autocomplete="off">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">Select Avatar:</div>
            <input type="file" id="input-avatar" accept="image/*">
            <button onclick="createProfile()">INITIALISE OPERATOR</button>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        
        <header>
            <img id="header-avatar" class="avatar" src="" alt="Avatar">
            <div class="header-info" style="width: 100%;">
                <h1 id="header-nick">OPERATOR</h1>
                <p>Level <span id="header-level" style="color: var(--accent); font-weight: bold;">1</span> | Rank: <span id="header-rank" style="color: var(--accent);">BRONZE</span></p>
                <div class="progress-bar">
                    <div class="progress-fill" id="header-xp-bar"></div>
                </div>
                <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; text-align: right;"><span id="header-xp">0</span>/100 XP</div>
            </div>
        </header>

        <div id="page-quests" class="page">
            <h2 class="panel-title">ACTIVE MISSIONS</h2>
            <div class="panel">
                <h3 style="color: #fff; font-size: 0.9rem; margin-bottom: 10px;">DAILY</h3>
                <div id="quests-daily-container"></div>
            </div>
            <div class="panel">
                <h3 style="color: #fff; font-size: 0.9rem; margin-bottom: 10px;">WEEKLY</h3>
                <div id="quests-weekly-container"></div>
            </div>
            <div class="panel">
                <h3 style="color: #fff; font-size: 0.9rem; margin-bottom: 10px;">MONTHLY</h3>
                <div id="quests-monthly-container"></div>
            </div>
        </div>

        <div id="page-combat" class="page hidden">
            <h2 class="panel-title">COMBAT LOG</h2>
            <div class="panel" id="martial-arts-list"></div>
            
            <div class="panel">
                <h3 style="color: var(--accent); font-size: 0.9rem; margin-bottom: 10px;">+ REGISTER DISCIPLINE</h3>
                <input type="text" id="new-ma-name" placeholder="Discipline (e.g. Jiu-Jitsu)">
                <input type="date" id="new-ma-date">
                <select id="new-ma-color">
                    <option value="#ffffff">White Belt</option>
                    <option value="#0044cc">Blue Belt</option>
                    <option value="#6600cc">Purple Belt</option>
                    <option value="#663300">Brown Belt</option>
                    <option value="#111111">Black Belt</option>
                    <option value="#cc0000">Red Belt</option>
                </select>
                <button onclick="addMartialArt()">REGISTER</button>
            </div>
        </div>

        <div id="page-codex" class="page hidden">
            <h2 class="panel-title">THE CODEX</h2>
            <div class="panel">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">
                    Loot acquired via missions. Ultra Rares drop at 0.01%.
                </p>
                <div id="codex-grid" class="codex-grid"></div>
            </div>
        </div>

        <div id="page-skills" class="page hidden">
            <h2 class="panel-title">SKILL TREE</h2>
            <div class="panel" id="skills-container"></div>
        </div>

        <div id="page-settings" class="page hidden">
            <h2 class="panel-title">SYSTEM SETTINGS</h2>
            <div class="panel">
                <input type="text" id="edit-nick" placeholder="New Nickname">
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">Change Avatar:</div>
                <input type="file" id="edit-avatar" accept="image/*">
                <button onclick="updateProfile()">SAVE PROFILE</button>
            </div>
            <div class="panel">
                <h3 style="color: #fff; font-size: 0.9rem; margin-bottom: 10px;">SYSTEM COLOUR</h3>
                <input type="color" id="edit-color" value="#00ffff" style="height: 50px; padding: 0; cursor: pointer;">
                <button onclick="updateThemeColor()">APPLY COLOUR</button>
            </div>
            <button onclick="resetSystem()" style="border-color: #550000; color: #ff5555; margin-top: 20px;">[ DANGER ] FACTORY RESET</button>
        </div>

        <nav class="navbar">
            <button class="nav-btn active" onclick="switchTab('quests', this)">Missions</button>
            <button class="nav-btn" onclick="switchTab('combat', this)">Combat</button>
            <button class="nav-btn" onclick="switchTab('codex', this)">Codex</button>
            <button class="nav-btn" onclick="switchTab('skills', this)">Skills</button>
            <button class="nav-btn" onclick="switchTab('settings', this)">Config</button>
        </nav>
    </div>

    <!-- Importando os Dados e a Lógica no final do body para otimizar carregamento -->
    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
