<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEGASUS OS - Terminal</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --cyan: #00ffff;
            --text-main: #eee;
            --text-muted: #888;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }
        
        .hidden { display: none !important; }

        /* HEADER E PERFIL */
        header { display: flex; align-items: center; border-bottom: 2px solid var(--cyan); padding-bottom: 15px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; border-radius: 5px; border: 1px solid var(--cyan); object-fit: cover; margin-right: 15px; }
        .header-info h1 { color: var(--cyan); font-size: 1.2rem; text-transform: uppercase; }
        .header-info p { color: var(--text-muted); font-size: 0.9rem; }

        /* PAINEIS TÁTICOS */
        .panel { background-color: var(--panel-bg); border: 1px solid #333; border-radius: 5px; padding: 15px; margin-bottom: 15px; box-shadow: 0 0 10px rgba(0, 255, 255, 0.05); }
        .panel-title { color: var(--cyan); font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px dashed #333; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; align-items: center;}
        .highlight { color: var(--cyan); font-weight: bold; }

        /* BOTÕES E INPUTS */
        button { background-color: transparent; color: var(--cyan); border: 1px solid var(--cyan); padding: 5px 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 3px; }
        button:active { background-color: var(--cyan); color: #000; }
        input, select { background-color: #000; color: var(--cyan); border: 1px solid #333; padding: 8px; width: 100%; margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; }
        input[type="file"] { padding: 5px; color: var(--text-muted); }

        /* BARRA DE PROGRESSO E FAIXAS */
        .progress-bar { width: 100%; background-color: #222; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--cyan); width: 0%; transition: width 0.3s; }
        
        .belt-container { margin-top: 15px; padding-top: 10px; border-top: 1px solid #222;}
        .belt { height: 25px; width: 100%; background-color: #fff; border: 2px solid #222; position: relative; margin-top: 5px; border-radius: 3px; }
        .stripes { position: absolute; right: 10px; top: 0; height: 100%; width: 30px; background-color: #000; display: flex; justify-content: space-evenly; align-items: center; }
        .stripe { height: 100%; width: 4px; background-color: #fff; }

        /* TELA DE LOGIN/SETUP */
        #setup-screen { text-align: center; margin-top: 20vh; }
        #setup-screen h2 { color: var(--cyan); margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- TELA 1: CRIAÇÃO DE PERFIL -->
    <div id="setup-screen" class="panel">
        <h2>INICIAR PROTOCOLO PEGASUS</h2>
        <input type="text" id="input-nick" placeholder="Digite seu Nickname" autocomplete="off">
        <div style="text-align: left; margin-bottom: 5px; color: var(--text-muted); font-size: 0.8rem;">Selecione um Avatar (Foto/GIF):</div>
        <input type="file" id="input-avatar" accept="image/*">
        <button onclick="criarPerfil()" style="width: 100%; padding: 10px; margin-top: 10px;">CRIAR OPERADOR</button>
    </div>

    <!-- TELA 2: TERMINAL PRINCIPAL -->
    <div id="app-screen" class="hidden">
        <header>
            <img id="user-avatar" class="avatar" src="" alt="Avatar">
            <div class="header-info">
                <h1 id="user-nick">OPERADOR</h1>
                <p>Status: Ativo | <span class="highlight" id="user-rank">BRONZE</span></p>
            </div>
        </header>

        <div class="panel">
            <h2 class="panel-title">MÓDULO DE PROGRESSÃO</h2>
            <div class="stat-row">
                <span>Nível <span id="user-level" class="highlight">1</span></span>
                <button onclick="ganharXP(25)">+ XP</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="xp-bar"></div>
            </div>
            <div style="text-align: right; font-size: 0.8rem; margin-top: 5px; color: var(--text-muted);"><span id="user-xp">0</span> / 100 XP</div>
        </div>

        <div class="panel">
            <h2 class="panel-title">REGISTRO DE COMBATE</h2>
            
            <div id="martial-arts-list"></div>

            <div style="margin-top: 20px; padding: 10px; border: 1px dashed #333;">
                <div style="color: var(--cyan); margin-bottom: 10px; font-size: 0.9rem;">+ CADASTRAR ARTE MARCIAL</div>
                <input type="text" id="new-ma-name" placeholder="Nome (Ex: Jiu-Jitsu)">
                <input type="date" id="new-ma-date">
                <select id="new-ma-color">
                    <option value="white">Branca</option>
                    <option value="blue">Azul</option>
                    <option value="purple">Roxa</option>
                    <option value="brown">Marrom</option>
                    <option value="black">Preta</option>
                    <option value="red">Vermelha</option>
                </select>
                <button onclick="adicionarArte()" style="width: 100%;">REGISTRAR</button>
            </div>
        </div>
        
        <button onclick="resetarSistema()" style="width: 100%; border-color: #550000; color: #ff5555;">[ PERIGO ] RESETAR SISTEMA</button>
    </div>

    <script>
        // --- SISTEMA DE DADOS (LOCAL STORAGE) ---
        let db = {
            nick: "",
            avatar: "",
            nivel: 1,
            xp: 0,
            artes: []
        };

        const ranks = ["Bronze", "Prata", "Ouro", "Platina", "Diamante", "Mestre", "Grão-Mestre", "Ruby"];

        function iniciar() {
            const savedData = localStorage.getItem('pegasus_db');
            if (savedData) {
                db = JSON.parse(savedData);
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                atualizarInterface();
            }
        }

        // --- FUNÇÕES DE PERFIL ---
        function criarPerfil() {
            const nick = document.getElementById('input-nick').value;
            const fileInput = document.getElementById('input-avatar');
            
            if (!nick) return alert("Digite um Nickname.");

            db.nick = nick;

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.avatar = e.target.result; // Salva a imagem como Base64 (suporta GIF)
                    salvarEAtualizar();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                // Avatar genérico se não enviar foto
                db.avatar = "https://via.placeholder.com/60/00ffff/000000?text=OP";
                salvarEAtualizar();
            }
        }

        function salvarEAtualizar() {
            localStorage.setItem('pegasus_db', JSON.stringify(db));
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            atualizarInterface();
        }

        // --- PROGRESSÃO DE NÍVEL ---
        function ganharXP(qtd) {
            db.xp += qtd;
            if (db.xp >= 100) {
                db.nivel += Math.floor(db.xp / 100);
                db.xp = db.xp % 100;
            }
            salvarEAtualizar();
        }

        function calcularRank() {
            let index = Math.floor(db.nivel / 13);
            if (index >= ranks.length) index = ranks.length - 1;
            return ranks[index];
        }

        // --- ARTES MARCIAIS ---
        function adicionarArte() {
            const nome = document.getElementById('new-ma-name').value;
            const data = document.getElementById('new-ma-date').value;
            const cor = document.getElementById('new-ma-color').value;

            if (!nome || !data) return alert("Preencha o nome e a data.");

            db.artes.push({ nome: nome, dataInicio: data, corCSS: cor, graus: 0 });
            
            // Limpa os inputs
            document.getElementById('new-ma-name').value = '';
            document.getElementById('new-ma-date').value = '';
            
            salvarEAtualizar();
        }

        function calcularDias(dataInicio) {
            const inicio = new Date(dataInicio);
            const hoje = new Date();
            const diferenca = Math.abs(hoje - inicio);
            return Math.floor(diferenca / (1000 * 60 * 60 * 24));
        }

        // --- RENDERIZAÇÃO DA INTERFACE ---
        function atualizarInterface() {
            document.getElementById('user-nick').innerText = db.nick;
            document.getElementById('user-avatar').src = db.avatar;
            document.getElementById('user-level').innerText = db.nivel;
            document.getElementById('user-xp').innerText = db.xp;
            document.getElementById('xp-bar').style.width = db.xp + "%";
            document.getElementById('user-rank').innerText = calcularRank().toUpperCase();

            const lista = document.getElementById('martial-arts-list');
            lista.innerHTML = "";

            db.artes.forEach((arte, index) => {
                const dias = calcularDias(arte.dataInicio);
                let divGraus = "";
                for(let i=0; i < arte.graus; i++) divGraus += '<div class="stripe"></div>';

                lista.innerHTML += `
                    <div class="belt-container">
                        <div class="stat-row">
                            <span>${arte.nome.toUpperCase()}</span>
                            <span class="highlight">${dias} Dias</span>
                        </div>
                        <div class="belt" style="background-color: ${arte.corCSS};">
                            <div class="stripes">${divGraus}</div>
                        </div>
                    </div>
                `;
            });
        }

        // --- RESET GERAL ---
        function resetarSistema() {
            if(confirm("ATENÇÃO: Deseja apagar todos os dados e formatar o operador?")) {
                localStorage.removeItem('pegasus_db');
                location.reload();
            }
        }

        // Executa ao carregar a página
        window.onload = iniciar;
    </script>
</body>
</html>
